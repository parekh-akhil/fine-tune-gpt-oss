# Configuration for fine-tuning GPT OSS 20B model with Unsloth

# Model configuration
model:
  name: "EleutherAI/gpt-neox-20b"  # GPT OSS 20B model
  max_seq_length: 2048
  load_in_4bit: true  # Use 4-bit quantization for memory efficiency
  dtype: null  # Auto-detect optimal dtype

# LoRA configuration for efficient fine-tuning
lora:
  r: 16  # LoRA rank
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# Training hyperparameters
training:
  output_dir: "./models/checkpoints"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  warmup_steps: 10
  learning_rate: 2.0e-4
  fp16: false
  bf16: true  # Use bfloat16 for better stability
  logging_steps: 10
  save_steps: 500
  save_total_limit: 3
  optim: "adamw_8bit"  # Memory-efficient optimizer
  weight_decay: 0.01
  max_grad_norm: 0.3
  lr_scheduler_type: "cosine"

# Dataset configuration
dataset:
  train_file: "./data/processed/train.jsonl"
  eval_file: "./data/processed/eval.jsonl"
  prompt_template: |
    ### Instruction:
    {instruction}
    
    ### Response:
    {response}
  max_samples: null  # Set to a number to limit training samples

# Generation settings (for inference)
generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1

# Weights & Biases (optional)
wandb:
  enabled: false
  project: "gpt-oss-20b-finetune"
  entity: null
  run_name: null
